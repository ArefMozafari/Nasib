[package]
name = "nasib-engine"
version = "0.1.0"
edition = "2024"
description = "Finds a Windscribe datacenter and protocol that carries traffic, connects to it, and keeps it connected."
license = "MIT"
publish = false

[lib]
name = "nasib_engine"
path = "src/lib.rs"

[[bin]]
name = "nasib-engine"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }

[profile.release]
strip = true
lto = true
